name: Publish approved PHP metadata to GitHub
run-name: Publish PHP metadata ${{ inputs.ticket }}
on:
  push:
    branches: [feature/php5-security-publication-20261021]
  workflow_dispatch:
    inputs:
      ticket:
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: oct-security-publication-${{ github.repository }}-metadata
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: oct-publication-20261021-metadata
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preserve replaced public metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PHP_SERIES: 'metadata'
        run: python3 publication/publish.py backup "$PHP_SERIES"
      - id: backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: previous-release-metadata-${{ github.run_attempt }}
          path: backup/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish approved package bytes
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_PACKAGE_ACCESS: ${{ secrets.PRIVATE_PACKAGE_ACCESS }}
          PHP_SERIES: 'metadata'
          BACKUP_ARTIFACT_ID: ${{ steps.backup.outputs.artifact-id }}
          BACKUP_ARTIFACT_DIGEST: ${{ steps.backup.outputs.artifact-digest }}
        run: python3 publication/publish.py publish "$PHP_SERIES"
      - name: Retain publication receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-metadata-${{ github.run_attempt }}
          path: receipts/
          if-no-files-found: warn
          retention-days: 90
  verify:
    if: github.event_name == 'workflow_dispatch'
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download and verify published files
        env:
          GH_TOKEN: ${{ github.token }}
          PHP_SERIES: 'metadata'
        run: python3 publication/publish.py verify "$PHP_SERIES"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-metadata-${{ github.run_attempt }}
          path: receipts/
          if-no-files-found: warn
          retention-days: 90
