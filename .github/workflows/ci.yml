name: Build PHP 5 backports
run-name: Build PHP 5.3–5.5 backports (${{ inputs.ticket || github.sha }})
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish all packages after native validation
        type: boolean
        default: true
      ticket:
        description: Unique dispatch tracking ticket
        type: string
        default: ''
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: build-php5
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  source:
    name: Resolve backport branches
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Resolve and verify source inputs
        run: bash scripts/backports/source-inputs.sh resolve "$RUNNER_TEMP/source-inputs"
      - uses: actions/upload-artifact@v7
        with:
          name: backport-source-inputs
          path: ${{ runner.temp }}/source-inputs
          if-no-files-found: error
          retention-days: 14

  build:
    needs: source
    name: Build PHP ${{ matrix.php }} ${{ matrix.target.arch }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        php: ['5.3', '5.4', '5.5']
        target:
          - {arch: x86_64, runner: ubuntu-24.04, suffix: ''}
          - {arch: arm64, runner: ubuntu-24.04-arm, suffix: '-arm64'}
    env:
      EXPECTED_ARCHITECTURE: ${{ matrix.target.arch }}
      BUILD_REPOSITORY: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: backport-source-inputs
          path: ${{ runner.temp }}/source-inputs
      - name: Select verified source
        run: bash scripts/backports/source-inputs.sh activate "$RUNNER_TEMP/source-inputs" --minor '${{ matrix.php }}'
      - name: Set build paths
        run: |
          {
            echo "BACKPORT_TASK_DIR=$RUNNER_TEMP/backport-task"
            echo "REPORT_DIR=$RUNNER_TEMP/report"
            echo "OUTPUT_DIR=$RUNNER_TEMP/packages"
          } >> "$GITHUB_ENV"
      - name: Build and inspect native packages
        run: |
          mkdir -p "$BACKPORT_TASK_DIR" "$REPORT_DIR" "$OUTPUT_DIR"
          bash scripts/backports/build.sh
          cp "$RUNNER_TEMP/source-inputs/manifest.json" "$REPORT_DIR/sources.json"
          zstd -t "$OUTPUT_DIR"/*.zst
          xz -t "$OUTPUT_DIR"/*.xz
          (cd "$OUTPUT_DIR" && sha256sum ./*.tar.* > SHA256SUMS)
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: php-${{ matrix.php }}-${{ matrix.target.arch }}
          path: ${{ runner.temp }}/packages
          if-no-files-found: error
          retention-days: 14
      - name: Upload source and runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.php }}-${{ matrix.target.arch }}
          path: ${{ runner.temp }}/report
          retention-days: 14

  test:
    needs: build
    name: Validate PHP ${{ matrix.php }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ['5.3', '5.4', '5.5']
        runner: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, ubuntu-22.04-arm, ubuntu-24.04-arm, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@v7
      - name: Set test paths
        run: |
          {
            echo "BACKPORT_TASK_DIR=$RUNNER_TEMP/test-task"
            echo "REPORT_DIR=$RUNNER_TEMP/report"
            echo "PACKAGE_DIR=$RUNNER_TEMP/packages"
          } >> "$GITHUB_ENV"
      - name: Determine native architecture
        id: arch
        run: |
          arch=$(uname -m)
          [[ "$arch" != aarch64 ]] || arch=arm64
          echo "value=$arch" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_ARCHITECTURE=$arch" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: php-${{ matrix.php }}-${{ steps.arch.outputs.value }}
          path: ${{ runner.temp }}/packages
      - uses: actions/download-artifact@v8
        with:
          name: backport-source-inputs
          path: ${{ runner.temp }}/source-inputs
      - name: Verify source and package bindings
        run: |
          bash scripts/backports/source-inputs.sh activate "$RUNNER_TEMP/source-inputs" --minor '${{ matrix.php }}'
          (cd "$PACKAGE_DIR" && sha256sum -c SHA256SUMS)
      - name: Install and validate candidate
        run: |
          mkdir -p "$BACKPORT_TASK_DIR" "$REPORT_DIR"
          bash scripts/backports/test.sh
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-${{ matrix.php }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/report
          retention-days: 14

  release:
    needs: [source, build, test]
    if: ${{ github.event_name == 'push' || inputs.publish }}
    name: Publish validated PHP 5 packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: php-5.*
          path: ${{ runner.temp }}/candidates
      - uses: actions/download-artifact@v8
        with:
          name: backport-source-inputs
          path: ${{ runner.temp }}/source-inputs
      - name: Verify complete candidate set
        run: |
          mkdir -p "$RUNNER_TEMP/publish" "$RUNNER_TEMP/backup"
          for minor in 5.3 5.4 5.5; do
            for arch in x86_64 arm64; do
              dir="$RUNNER_TEMP/candidates/php-$minor-$arch"
              (cd "$dir" && sha256sum -c SHA256SUMS)
              suffix=''; [[ "$arch" != arm64 ]] || suffix=-arm64
              for name in "php-$minor-build$suffix.tar.zst" "php-$minor$suffix.tar.zst" "php-$minor$suffix.tar.xz"; do
                test -f "$dir/$name"
                cp "$dir/$name" "$RUNNER_TEMP/publish/"
              done
            done
          done
          test "$(find "$RUNNER_TEMP/publish" -name '*.tar.*' | wc -l)" -eq 18
          zstd -t "$RUNNER_TEMP/publish"/*.zst
          xz -t "$RUNNER_TEMP/publish"/*.xz
          cp scripts/install.sh "$RUNNER_TEMP/publish/install.sh"
          cp "$RUNNER_TEMP/source-inputs/manifest.json" "$RUNNER_TEMP/publish/php5-source-manifest.json"
          (cd "$RUNNER_TEMP/publish" && sha256sum ./*.tar.* install.sh php5-source-manifest.json > php5-SHA256SUMS)
      - name: Back up current assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download builds --repo "$GITHUB_REPOSITORY" --pattern 'php-5.*' --pattern install.sh --dir "$RUNNER_TEMP/backup"
      - uses: actions/upload-artifact@v7
        with:
          name: previous-release-${{ github.run_id }}
          path: ${{ runner.temp }}/backup
          if-no-files-found: error
          retention-days: 30
      - name: Publish and verify exact release bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload builds --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP"/publish/* --clobber
          mkdir "$RUNNER_TEMP/readback"
          for asset in "$RUNNER_TEMP"/publish/*; do
            name=$(basename "$asset")
            gh release download builds --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$RUNNER_TEMP/readback"
            cmp "$asset" "$RUNNER_TEMP/readback/$name"
          done
